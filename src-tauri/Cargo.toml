[package]
name = "swaggy-editor"
version = "0.1.0"
description = "Editor y visor de especificaciones OpenAPI / Swagger"
edition = "2021"
default-run = "swaggy-editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
